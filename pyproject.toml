[project]
name = "mcp-for-blender"
version = "2.1.9"
description = "Open source Blender integration through the Model Context Protocol (not affiliated with Blender Foundation)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Siddharth Ahuja", email = "ahujasid@gmail.com"}
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.26.0,<2",
    "httpx>=0.27.0",
]

[project.scripts]
mcp-for-blender = "blender_mcp.server:main"

# Installed by `uv run`/`uv sync` by default; not part of the published package.
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]

# Only what is certainly a bug: syntax errors, invalid comparisons, undefined
# names. No style rules.
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
blender_mcp = ["bundled/addon.py", "apps/*.html", "guides/*.md"]

[project.urls]
"Homepage" = "https://github.com/JosueMFlores/mcp-for-blender"
"Bug Tracker" = "https://github.com/JosueMFlores/mcp-for-blender/issues"
"Upstream" = "https://github.com/ahujasid/blender-mcp"
